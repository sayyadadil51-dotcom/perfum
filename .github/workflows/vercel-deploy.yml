name: Deploy to Vercel

on:
  push:
    branches: [arena/01a0cdec-perfum, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check VERCEL_TOKEN secret
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret missing — repo Settings → Secrets and variables → Actions → New secret (Name: VERCEL_TOKEN)"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel deploy \
            --prod \
            --yes \
            --name perfum \
            --token="$VERCEL_TOKEN"

      - name: Print deployment URL
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel ls --token="$VERCEL_TOKEN" || true

# trigger: retry vercel deploy
